<form [formGroup]="form" (ngSubmit)="submit($event)" novalidate>
  <div class="form-field" [class.invalid]="isControlInvalid('email')">
    <label for="login-email">Email</label>
    <input
      id="login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
    />
    <p class="error" *ngIf="hasError('email', 'required')">
      Email is required.
    </p>
  </div>

  <div class="form-field" [class.invalid]="isControlInvalid('password')">
    <label for="login-password">Password</label>
    <input
      id="login-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    <p class="error" *ngIf="hasError('password', 'required')">
      Password is required.
    </p>
  </div>

  <div class="form-actions">
    <ng-content select="[formActions]"></ng-content>
  </div>
</form>
